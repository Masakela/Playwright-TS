name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Result import runs only when the Xray secret exists, so the job stays green
    # until you configure it. (secrets can't be read directly in `if:`, so we flag
    # it here and check the flag on the step.)
    env:
      XRAY_CONFIGURED: ${{ secrets.XRAY_CLIENT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm install
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Start reference agent
        run: |
          node agent-server/server.js & echo $! > agent.pid
          for i in $(seq 1 30); do curl -sf http://localhost:8080/health && break || sleep 0.5; done
      - name: Run Playwright tests (offline + live agent)
        env:
          AGENT_BASE_URL: http://localhost:8080
          ALLURE: '1'
        run: npx playwright test
      - name: Stop reference agent
        if: always()
        run: kill "$(cat agent.pid)" 2>/dev/null || true
      - name: Import results into Jira/Xray
        if: ${{ always() && env.XRAY_CONFIGURED == 'true' }}
        env:
          XRAY_CLIENT_ID:     ${{ secrets.XRAY_CLIENT_ID }}
          XRAY_CLIENT_SECRET: ${{ secrets.XRAY_CLIENT_SECRET }}
          XRAY_PROJECT_KEY:   QA          # <<< set your Jira project key
          # XRAY_TEST_PLAN_KEY: QA-100    # optional: attach to a Test Plan
        run: node scripts/import-results.js xray --junit test-results/junit.xml
      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: ts-report, path: playwright-report, if-no-files-found: ignore }
      - name: Upload JSON results
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: ts-results, path: test-results/results.json, if-no-files-found: ignore }
      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: ts-junit, path: test-results/junit.xml, if-no-files-found: ignore }
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: ts-allure, path: allure-results, if-no-files-found: ignore }

  report:
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    # The stakeholder email is sent only when the SMTP secret exists, so the job
    # stays green until you add the mail secrets. (secrets can't be read directly
    # in `if:`, so we flag it here and check the flag on the step.)
    env:
      MAIL_CONFIGURED: ${{ secrets.SMTP_HOST != '' }}
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Restore KPI history
        uses: actions/cache@v4
        with:
          path: kpi-history
          key: kpi-history-${{ github.run_id }}
          restore-keys: kpi-history-
      - name: Assemble
        run: |
          mkdir -p site kpi-history
          cp -r artifacts/ts-allure allure-results 2>/dev/null || mkdir -p allure-results
      - name: Build KPI dashboard
        run: >
          node scripts/kpi-report.js
          --pw artifacts/ts-results/results.json
          --out site
          --history kpi-history/history.json
          --branch "${{ github.ref_name }}"
          --commit "${{ github.sha }}"
          --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Generate Allure report
        continue-on-error: true
        run: |
          npm install -g allure-commandline
          allure generate allure-results --clean -o site/allure
      - name: Add Playwright HTML report
        run: |
          mkdir -p site/playwright-report
          cp -r artifacts/ts-report/. site/playwright-report/ 2>/dev/null || true
      - name: KPI summary -> job summary
        run: cat site/kpi-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload combined report
        uses: actions/upload-artifact@v4
        with: { name: qa-report-site, path: site }
      - name: Configure Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - name: Deploy to GitHub Pages
        id: deploy
        if: github.ref == 'refs/heads/main'
        uses: actions/deploy-pages@v4
      - name: Email QA status digest to stakeholders
        if: ${{ github.ref == 'refs/heads/main' && env.MAIL_CONFIGURED == 'true' }}
        env:
          SMTP_HOST:           ${{ secrets.SMTP_HOST }}
          SMTP_PORT:           ${{ secrets.SMTP_PORT }}
          SMTP_SECURE:         ${{ secrets.SMTP_SECURE }}
          SMTP_USER:           ${{ secrets.SMTP_USER }}
          SMTP_PASS:           ${{ secrets.SMTP_PASS }}
          MAIL_FROM:           ${{ secrets.MAIL_FROM }}
          MAIL_TO:             ${{ secrets.MAIL_TO }}
          MAIL_SUBJECT_PREFIX: '[QA] Playwright-TS'
        run: |
          npm install nodemailer --no-save --no-package-lock
          if [ -f artifacts/ts-junit/junit.xml ]; then
            node scripts/email-digest.js --junit artifacts/ts-junit/junit.xml --dashboard-url "${{ steps.deploy.outputs.page_url }}"
          else
            echo "No JUnit results found; skipping stakeholder digest."
          fi
