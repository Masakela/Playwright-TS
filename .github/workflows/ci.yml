# >>> MOVE THIS FILE TO:  .github/workflows/ci.yml  <<<
# GitHub protects the .github/workflows/ path, so remote tools cannot write there.
# In this project folder run (PowerShell):
#   New-Item -ItemType Directory -Force .github\workflows
#   Move-Item github-actions-ci.yml .github\workflows\ci.yml

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm install
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Start reference agent
        run: |
          node agent-server/server.js & echo $! > agent.pid
          for i in $(seq 1 30); do curl -sf http://localhost:8080/health && break || sleep 0.5; done
      - name: Run Playwright tests (offline + live agent)
        env:
          AGENT_BASE_URL: http://localhost:8080
          ALLURE: '1'
        run: npx playwright test
      - name: Stop reference agent
        if: always()
        run: kill "$(cat agent.pid)" 2>/dev/null || true
      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: ts-report, path: playwright-report, if-no-files-found: ignore }
      - name: Upload JSON results
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: ts-results, path: test-results/results.json, if-no-files-found: ignore }
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: ts-allure, path: allure-results, if-no-files-found: ignore }

  report:
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Restore KPI history
        uses: actions/cache@v4
        with:
          path: kpi-history
          key: kpi-history-${{ github.run_id }}
          restore-keys: kpi-history-
      - name: Assemble
        run: |
          mkdir -p site kpi-history
          cp -r artifacts/ts-allure allure-results 2>/dev/null || mkdir -p allure-results
      - name: Build KPI dashboard
        run: >
          node scripts/kpi-report.js
          --pw artifacts/ts-results/results.json
          --out site
          --history kpi-history/history.json
          --branch "${{ github.ref_name }}"
          --commit "${{ github.sha }}"
          --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Generate Allure report
        continue-on-error: true
        run: |
          npm install -g allure-commandline
          allure generate allure-results --clean -o site/allure
      - name: Add Playwright HTML report
        run: |
          mkdir -p site/playwright-report
          cp -r artifacts/ts-report/. site/playwright-report/ 2>/dev/null || true
      - name: KPI summary -> job summary
        run: cat site/kpi-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload combined report
        uses: actions/upload-artifact@v4
        with: { name: qa-report-site, path: site }
      - name: Configure Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - name: Deploy to GitHub Pages
        id: deploy
        if: github.ref == 'refs/heads/main'
        uses: actions/deploy-pages@v4
